# Publica la app en GitHub Pages.
#
# Modo seguro (recomendado): si el repositorio tiene los secretos CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID,
# primero se publica el Worker de Cloudflare con tus claves de API como secretos DEL WORKER, y la web solo lleva
# la dirección del Worker: las claves NO aparecen en la web publicada.
#
# Modo sencillo (si no hay Cloudflare configurado): las claves se escriben en js/env.js y quedan visibles en la web.
name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  worker:
    runs-on: ubuntu-latest
    outputs:
      url: ${{ steps.url.outputs.url }}
    env:
      CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CF_ACCOUNT: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      FMP_KEY: ${{ secrets.FMP_KEY }}
      FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
      TD_KEY: ${{ secrets.TD_KEY }}
      ROIC_KEY: ${{ secrets.ROIC_KEY }}
      AV_KEY: ${{ secrets.AV_KEY }}
      SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}
    steps:
      - name: Comprobar que los dos secretos de Cloudflare van juntos
        run: |
          if [ -n "$CF_TOKEN" ] && [ -z "$CF_ACCOUNT" ]; then echo "::error::Falta CLOUDFLARE_ACCOUNT_ID (solo hay CLOUDFLARE_API_TOKEN). No se publica para no exponer las claves."; exit 1; fi
          if [ -z "$CF_TOKEN" ] && [ -n "$CF_ACCOUNT" ]; then echo "::error::Falta CLOUDFLARE_API_TOKEN (solo hay CLOUDFLARE_ACCOUNT_ID). No se publica para no exponer las claves."; exit 1; fi
      - name: Diagnóstico de Cloudflare (sin mostrar secretos)
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        run: |
          set -u
          T="$(printf '%s' "$CF_TOKEN" | tr -d '[:space:]')"; A="$(printf '%s' "$CF_ACCOUNT" | tr -d '[:space:]')"
          [ "$T" != "$CF_TOKEN" ] && echo "::warning::El token tenía espacios o saltos de línea al pegarlo."
          [ "$A" != "$CF_ACCOUNT" ] && echo "::warning::El Account ID tenía espacios o saltos de línea al pegarlo."
          echo "Longitud del Account ID: ${#A} caracteres (debe ser 32)"
          V="$(curl -s -H "Authorization: Bearer $T" https://api.cloudflare.com/client/v4/user/tokens/verify)"
          echo "$V" | jq -e '.success' >/dev/null || V="$(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/tokens/verify")" # token de cuenta
          echo "Token: $(echo "$V" | jq -r 'if .success then "válido, estado " + .result.status else "NO válido: " + ([.errors[]?.message] | join("; ")) end')"
          L="$(curl -s -H "Authorization: Bearer $T" 'https://api.cloudflare.com/client/v4/accounts?per_page=50')"
          N="$(echo "$L" | jq -r '.result | length // 0')"
          echo "Cuentas que este token puede ver: $N"
          echo "$L" | jq -r '.result[]? | "  - cuenta con ID que empieza por " + (.id[0:6]) + "…"' # sin el nombre: el registro es público
          if echo "$L" | jq -e --arg a "$A" '.result[]? | select(.id == $a)' >/dev/null; then echo "El Account ID guardado COINCIDE con una cuenta del token."; else echo "::error::El Account ID guardado NO coincide con ninguna cuenta que el token pueda ver. Copia el ID de la lista de arriba (Workers & Pages → Account ID) o crea el token con Account Resources = Include → tu cuenta."; fi
          S="$(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/subdomain")"
          echo "Subdominio workers.dev: $(echo "$S" | jq -r 'if .success then (.result.subdomain // "sin crear") else "no accesible: " + ([.errors[]?.message] | join("; ")) end')"
          P="$(curl -s -H "Authorization: Bearer $T" "https://api.cloudflare.com/client/v4/accounts/$A/workers/scripts")"
          echo "Permiso para listar Workers: $(echo "$P" | jq -r 'if .success then "sí" else "NO: " + ([.errors[]?.message] | join("; ")) end')"
          echo "Si el despliegue responde «No access to the specified resource» con todo lo anterior bien, al token le falta el permiso de ESCRITURA: Account → Workers Scripts → Edit (plantilla «Edit Cloudflare Workers»)."
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        with:
          node-version: 22
      - name: Publicar el Worker y guardar en él solo las claves que existan
        id: url
        if: env.CF_TOKEN != '' && env.CF_ACCOUNT != ''
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        working-directory: worker
        run: |
          # Si algo falla con Cloudflare configurado, la publicación se DETIENE: nunca se cae al modo con claves visibles
          set -euo pipefail
          npx --yes wrangler@3 deploy | tee deploy.log
          for K in FMP_KEY FINNHUB_KEY TD_KEY ROIC_KEY AV_KEY; do
            V="${!K}"
            if [ -n "$V" ]; then printf '%s' "$V" | npx --yes wrangler@3 secret put "$K" >/dev/null; echo "Secreto $K guardado en el Worker"; fi
          done
          # La SEC exige identificarse con un nombre y un email de contacto real; va como secreto, nunca en el código público
          if [ -n "${SEC_CONTACT_EMAIL:-}" ]; then printf 'InvestmentIntelligencePro %s' "$SEC_CONTACT_EMAIL" | npx --yes wrangler@3 secret put SEC_USER_AGENT >/dev/null; echo "Identificación para la SEC guardada en el Worker"; else echo "::warning::Falta el secreto SEC_CONTACT_EMAIL: la SEC rechazará las peticiones (403) y las cuentas saldrán de FMP y Finnhub"; fi
          U=$(grep -oE 'https://[a-zA-Z0-9.-]+\.workers\.dev' deploy.log | head -1)
          echo "url=${U}" >> "$GITHUB_OUTPUT"
          if [ -z "$U" ]; then echo "No se obtuvo la dirección del Worker: se detiene la publicación para no exponer las claves"; exit 1; fi
          echo "Worker publicado en $U"
      - name: Prueba en vivo del Worker (SEC, Europa y proveedores)
        if: steps.url.outputs.url != ''
        env:
          U: ${{ steps.url.outputs.url }}
        run: |
          sleep 5
          declare -A ST
          # Cada petición con 60 s y un reintento; un fallo de curl (tiempo agotado) no aborta el paso: queda como HTTP 000
          t() { for i in 1 2; do R="$(curl -s -m 60 -H 'Origin: https://carlosgomezs.github.io' -w '\n%{http_code}' "$U/$2" || true)"; C="$(echo "$R" | tail -1)"; [ "$C" = "200" ] && break; sleep 5; done; B="$(echo "$R" | sed '$d')"; ST[$4]=$C; echo "$1 → HTTP $C · $(echo "$B" | jq -r "$3" 2>/dev/null | head -c 160)"; }
          t "SEC EDGAR (ventas de Apple)" "sec/api/xbrl/companyconcept/CIK0000320193/us-gaap/RevenueFromContractWithCustomerExcludingAssessedTax.json" '"\(.entityName) · \(.units.USD | length) datos de ventas"' sec
          t "SEC EDGAR (lista de tickers)" "sec/files/company_tickers.json" '"\(length) empresas"' sect
          (curl -s -m 60 -H 'Origin: https://carlosgomezs.github.io' "$U/sec/files/company_tickers.json" || true) | head -c 400 | grep -q 'Undeclared Automated Tool' && echo "::warning::La SEC no acepta la identificación: revisa el secreto SEC_CONTACT_EMAIL (debe ser un email real)" || true
          t "Europa ESEF (filings.xbrl.org)" "esef/api/filings?page%5Bsize%5D=1" '"\(.data | length) informe(s) recibido(s)"' esef
          t "FMP (perfil de Apple)" "fmp/profile?symbol=AAPL" 'if type=="array" then .[0].companyName else (.error // ."Error Message" // .) end' fmp
          t "Finnhub (perfil de Apple)" "finnhub/stock/profile2?symbol=AAPL" '.name // .error' fh
          t "Twelve Data (cotización de Apple)" "td/quote?symbol=AAPL" '.close // .message' td
          # Críticos: la SEC (cuentas sin cupo) y al menos una fuente de cotización. FMP agotado (429) no bloquea.
          [ "${ST[sec]}" = "200" ] && [ "${ST[sect]}" = "200" ] || { echo "::error::La SEC no responde bien a través del Worker: se detiene la publicación"; exit 1; }
          [ "${ST[fh]}" = "200" ] || [ "${ST[td]}" = "200" ] || { echo "::error::Ni Finnhub ni Twelve Data responden a través del Worker: se detiene la publicación"; exit 1; }
          echo "Worker comprobado en vivo: correcto"
      - name: Modo
        env:
          U: ${{ steps.url.outputs.url }}
        run: |
          if [ -n "$U" ]; then echo "Modo seguro"; else echo "::error::Sin Worker de Cloudflare no se publica: las claves quedarían visibles en la web. Configura CLOUDFLARE_API_TOKEN y CLOUDFLARE_ACCOUNT_ID."; exit 1; fi

  deploy:
    needs: worker
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: npm test
      - name: Escribir la configuración en js/env.js
        env:
          WORKER_URL: ${{ needs.worker.outputs.url }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          node -e '
            const proxy = process.env.WORKER_URL || process.env.PROXY_URL;
            // Solo modo seguro: la web lleva la dirección del Worker y nunca las claves. Sin Worker, la publicación se detiene.
            if (!proxy) { console.error("Sin Worker: no se publica para no dejar las claves visibles"); process.exit(1); }
            const k = { proxyUrl: proxy };
            for (const x in k) if (!k[x]) delete k[x];
            require("fs").writeFileSync("js/env.js", "window.__IIP_KEYS = " + JSON.stringify(k) + ";\n");
            console.log("Modo seguro: la web solo lleva la dirección del Worker");
          '
          sed -i "s#src=\"js/env.js[^\"]*\"#src=\"js/env.js?v=${GITHUB_RUN_NUMBER}\"#" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
