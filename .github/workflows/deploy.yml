# Publica la app en GitHub Pages e incrusta las claves guardadas como secretos del repositorio.
# Aviso: las claves quedan dentro de js/env.js de la web publicada (visibles para quien mire el código).
name: Publicar app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Pruebas
        run: npm test
      - name: Escribir claves en js/env.js
        env:
          FMP_KEY: ${{ secrets.FMP_KEY }}
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          TD_KEY: ${{ secrets.TD_KEY }}
          ROIC_KEY: ${{ secrets.ROIC_KEY }}
          AV_KEY: ${{ secrets.AV_KEY }}
          PROXY_URL: ${{ secrets.PROXY_URL }}
        run: |
          node -e '
            const k = { fmpKey: process.env.FMP_KEY, finnhubKey: process.env.FINNHUB_KEY, tdKey: process.env.TD_KEY, roicKey: process.env.ROIC_KEY, avKey: process.env.AV_KEY, proxyUrl: process.env.PROXY_URL };
            for (const x in k) if (!k[x]) delete k[x];
            require("fs").writeFileSync("js/env.js", "window.__IIP_KEYS = " + JSON.stringify(k) + ";\n");
            console.log("Claves incluidas:", Object.keys(k).join(", ") || "ninguna");
          '
          sed -i "s#src=\"js/env.js[^\"]*\"#src=\"js/env.js?v=${GITHUB_RUN_NUMBER}\"#" index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
